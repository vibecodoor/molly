# Push a tag like v0.1.0 (matching package.json "version") to build the zip and publish a release.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npx wxt zip
      - uses: softprops/action-gh-release@v3
        with:
          files: .output/*-chrome.zip
          generate_release_notes: true
